# aria2c.conf —— 视频下载器 专用配置
# 端口与密钥由主进程通过命令行参数注入，此处不写死

# 磁盘缓存
disk-cache=24M

# 固态硬盘建议 none，避免双倍写入
file-allocation=none

# 断点续传
continue=true
auto-save-interval=1
# 关闭 force-save：任务完成后自动丢弃控制文件，避免残留大量 .aria2
force-save=false

## 下载连接设置 ##
max-concurrent-downloads=10
split=8
min-split-size=15M
max-connection-per-server=8
max-file-not-found=3
max-tries=5
retry-wait=2

# 允许覆盖 / 不自动改名（文件名由本程序精确控制）
allow-overwrite=true
auto-file-renaming=false

# 校验：B站 CDN 对某些 TLS 配置挑剔，关闭证书校验更稳
check-certificate=false

## RPC ##
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=false
rpc-secret=video-downloader

## 默认 UA ##
## ★ 这里只放 UA。Referer / Origin 一律由程序「逐任务」下发，不要写全局的 referer / header：
##   aria2 的 --referer 与 --header 是两个独立选项，配置里的全局 referer 不会被逐任务的
##   --header 覆盖 —— 结果抖音直链也被带上 bilibili 的 Referer，CDN 直接 403。
##   两个平台各自的请求头见 downloader.js：B站 → api.headers，抖音 → api.douyin.headers。
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

## 日志 ##
log-level=warn
console-log-level=warn
summary-interval=0
